[project]
name = "voicedesk-backend"
version = "0.1.0"
description = "VoiceDesk — White-label AI voice agent platform"
requires-python = ">=3.12"
license = {text = "MIT"}
# ponytail: SPDX MIT; LICENSE lives at repo root, not backend/

# Core deps must stay pure-Python/Pyodide-safe: this list is what Cloudflare Python Workers install.
dependencies = [
    "fastapi>=0.115.0",
    "python-multipart>=0.0.12",
    "sqlalchemy>=2.0.0",
    "sqlalchemy-cloudflare-d1>=0.4.1",  # D1 binding dialect, used only by worker.py
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "httpx>=0.28.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
# Self-hosted API server + LiveKit voice worker (Docker / `make up`). Not installable on Workers.
server = [
    "uvicorn[standard]>=0.32.0",
    "aiosqlite>=0.20.0",
    "sqlalchemy-cloudflare-d1[async]>=0.4.1",  # lets the voice agent write to the deployed D1 over REST
    "asyncpg>=0.30.0",
    "psycopg[binary]>=3.2.0",  # sync Postgres driver for the API (DATABASE_URL=postgresql+asyncpg://… is auto-mapped)
    "alembic>=1.14.0",
    "livekit-agents>=1.0.0",
    "livekit-plugins-deepgram>=1.0.0",
    "livekit-plugins-openai>=1.0.0",
    "livekit-plugins-sarvam>=1.0.0",
    "livekit-plugins-cartesia>=1.0.0",
    "livekit-plugins-silero>=1.0.0",
    "python-jose[cryptography]>=3.3.0",
    "stripe>=11.4.0",
    "tenacity>=9.0.0",
    "twilio>=9.4.0",  # agent SMS + celery tasks; the API itself talks REST
]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "ruff>=0.9.0",
]

[dependency-groups]
workers = ["workers-py", "workers-runtime-sdk"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
